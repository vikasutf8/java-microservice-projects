spring.application.name=RestfullApi

spring.datasource.url=jdbc:postgresql://localhost:5432/JavaLearn
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update

#spring.jpa.hibernate.ddl-auto=none ====prod
#spring.jpa.hibernate.ddl-auto=validate ====prod
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-location=classpath:seed.sql


#spring security
spring.security.user.name=admin
spring.security.user.password=admin  # remove deflaut password