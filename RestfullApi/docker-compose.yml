version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-net

  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "always",
      "--save", "60", "1000"
    ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "5540:5540"   # UI exposed here
    depends_on:
      - redis
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:

networks:
  app-net:
