server:
  port: 8086
spring:
  application:
    name: Wallet_Service

  datasource:
    url: jdbc:h2:mem:testdb   # in-memory DB
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop   # best for testing
      show-sql: true

    h2:
      console:
        enabled: true
        path: /h2-console